name: Rate WYT Item

on:
  workflow_dispatch:
    inputs:
      item_url:
        description: URL of the rated article
        required: true
      title:
        description: Article title
        required: true
      rating:
        description: Rating value (1, 0, or -1)
        required: true
      category:
        description: Topic category
        required: true
      tier:
        description: Content tier (1, 2, or 3)
        required: true

permissions:
  contents: write

env:
  PAT_FULL_ACCESS: ${{ secrets.PAT_FULL_ACCESS }}

jobs:
  save-rating:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FULL_ACCESS }}

      # ── Restore logs cache ────────────────────────────────────────────────────
      - name: Restore logs cache
        uses: actions/cache@v4
        with:
          path: logs/
          key: digest-logs-${{ github.run_number }}
          restore-keys: |
            digest-logs-

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Save rating and update library
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from datetime import date

          url      = os.environ['ITEM_URL']
          title    = os.environ['TITLE']
          rating   = int(os.environ['RATING'])
          category = os.environ['CATEGORY']
          tier     = int(os.environ['TIER'])
          today    = date.today().isoformat()

          # ── Update wyt_ratings.json ──────────────────────────────────────────
          ratings_file = 'logs/wyt_ratings.json'
          os.makedirs('logs', exist_ok=True)
          try:
              with open(ratings_file) as f:
                  data = json.load(f)
          except Exception:
              data = {'ratings': [], 'category_scores': {}, 'source_scores': {}}

          # Prevent duplicate ratings for the same URL on the same day
          already_rated = any(
              r.get('url') == url and r.get('date') == today
              for r in data.get('ratings', [])
          )
          if already_rated:
              print(f"Duplicate rating ignored for: {title}")
              sys.exit(0)

          data.setdefault('ratings', []).append({
              'url':      url,
              'title':    title,
              'rating':   rating,
              'category': category,
              'tier':     tier,
              'date':     today,
          })

          cat = data.setdefault('category_scores', {}).get(category, {'total': 0, 'count': 0})
          cat['total'] += rating
          cat['count'] += 1
          data['category_scores'][category] = cat

          with open(ratings_file, 'w') as f:
              json.dump(data, f, indent=2)
          print(f"Saved rating {rating:+d} for: {title}")

          # ── Update wyt_library.yaml ──────────────────────────────────────────
          try:
              import yaml
              lib_file = 'wyt_library.yaml'
              with open(lib_file) as f:
                  library = yaml.safe_load(f)
              updated = False
              for item in library.get('items', []):
                  if item.get('url') == url:
                      item['cumulative_rating'] = item.get('cumulative_rating', 0) + rating
                      updated = True
                      break
              if updated:
                  with open(lib_file, 'w') as f:
                      yaml.dump(library, f, default_flow_style=False, allow_unicode=True)
                  print(f"Updated library cumulative_rating for: {title}")
              else:
                  print(f"Article not in library — rating recorded in wyt_ratings.json only")
          except Exception as e:
              print(f"Could not update library: {e}")

          EOF
        env:
          ITEM_URL:  ${{ inputs.item_url }}
          TITLE:     ${{ inputs.title }}
          RATING:    ${{ inputs.rating }}
          CATEGORY:  ${{ inputs.category }}
          TIER:      ${{ inputs.tier }}

      - name: Commit updated ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PAT_FULL_ACCESS}@github.com/${{ github.repository }}.git
          git add logs/wyt_ratings.json wyt_library.yaml
          git diff --staged --quiet || git commit -m "Save WYT rating [skip ci]"
          git push origin main

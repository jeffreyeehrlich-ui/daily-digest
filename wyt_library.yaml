  url: http://www.incompleteideas.net/IncIdeas/BitterLesson.html
  why_worth_reading: 'A two-page essay by a pioneer of reinforcement learning arguing
    that seventy years of AI research shows one consistent lesson: general methods
    that scale with computation beat hand-crafted domain knowledge every time. The
    implications for how humans should relate to AI tools are profound and counterintuitive.

    '
  year_published: 2019

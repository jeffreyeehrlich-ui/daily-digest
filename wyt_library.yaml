  url: https://www.oaktreecapital.com/docs/default-source/memos/2018-09-06-mastering-the-market-cycle.pdf
  why_worth_reading: 'Marks on how to identify where in the cycle markets currently
    sit — and why the answer is less about prediction than about reading current investor
    psychology. The framework translates directly to real estate cycle positioning.

    '
  year_published: 2018
- _library_item: true
  accessibility: general
  author: Ben Hunt
  category: investing_finance
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 9
  source: Epsilon Theory
  tier: 2
  times_featured: 0
  title: The Skew — Epsilon Theory
  url: https://www.epsilontheory.com/the-skew/
  why_worth_reading: 'Ben Hunt argues that modern markets are increasingly driven
    by narrative more than fundamentals — and that understanding which stories have
    captured investor attention is now as important as reading financial statements.
    A genuinely different lens for thinking about markets and price discovery.

    '
  year_published: 2020

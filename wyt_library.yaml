  title: A New Theory of Time Could Explain Why You're Always Late
  url: https://www.quantamagazine.org/a-new-theory-of-time-could-explain-why-youre-always-late-20210826/
  why_worth_reading: 'Quanta''s explainer on the physics of time — why our subjective
    experience of time passing forward doesn''t follow obviously from the laws of
    physics, and what thermodynamics has to do with memory and causation. Written
    for intelligent general readers, no physics background assumed.

    '
  year_published: 2021
- _library_item: true
  accessibility: general
  author: Joshua Sokol
  category: hard_science
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 9
  source: Quanta Magazine
  tier: 2
  times_featured: 0
  title: How the Brain Creates a Timeline of the Past
  url: https://www.quantamagazine.org/how-the-brain-creates-a-timeline-of-the-past-20190212/
  why_worth_reading: 'New research revealed that the hippocampus doesn''t store memories
    in chronological order at all — it encodes them by novelty and context, which
    is why memory is so reconstructive rather than reproductive. The implications
    for how we make decisions based on "what happened before" are unsettling and useful.

    '
  year_published: 2019
- _library_item: true
  accessibility: general
  author: Charlie Wood
  category: hard_science
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 8
  source: Quanta Magazine
  tier: 1
  times_featured: 0
  title: The Simple Idea Behind Einstein's Greatest Discoveries
  url: https://www.quantamagazine.org/the-simple-idea-behind-einsteins-greatest-discoveries-20190527/
  why_worth_reading: 'Symmetry as a creative constraint — how Einstein''s insistence
    that the laws of physics look the same to all observers forced him to rewrite
    time, space, and gravity. The essay explains this without equations, making it
    genuinely accessible to anyone curious about how scientific revolutions actually
    happen.

    '
  year_published: 2019
- _library_item: true
  accessibility: general
  author: Ed Yong
  category: hard_science
  cooldown_days: 180
  cumulative_rating: 0

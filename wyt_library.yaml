  tier: 2
  times_featured: 0
  title: The Pandemic Virus Is Slowly Mutating — But Will It Weaken?
  url: https://www.theatlantic.com/science/archive/2020/12/coronavirus-mutation-evolution/617531/
  why_worth_reading: 'Ed Yong''s explanation of viral evolution remains the best lay-accessible
    account of how viruses mutate, why fitness pressures don''t always favor attenuation,
    and why predicting viral trajectories is genuinely hard. The framework applies
    to any rapidly evolving system.

    '
  year_published: 2020
- _library_item: true
  accessibility: general
  author: Philip Ball
  category: hard_science
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 11
  source: Quanta Magazine
  tier: 1
  times_featured: 0
  title: How Life Could Continue to Evolve
  url: https://www.quantamagazine.org/what-is-life-and-how-could-it-continue-to-evolve-20210805/
  why_worth_reading: 'The question of what exactly constitutes "life" — and whether
    synthetic and artificial systems could eventually qualify — opens onto deep questions
    about complexity, information, and evolution that no discipline has fully answered.
    Quanta''s treatment is rigorous without being technical.

    '
  year_published: 2021
- _library_item: true
  accessibility: general
  author: Lisa Feldman Barrett
  category: hard_science
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 8
  source: Aeon
  tier: 2
  times_featured: 0
  title: Your Brain Is Not for Thinking
  url: https://www.nytimes.com/2021/11/23/health/lisa-feldman-barrett-brain-function.html
  why_worth_reading: 'Neuroscientist Lisa Feldman Barrett''s argument that the brain''s
    primary function is not thinking or perceiving but regulating the body — and that
    all our cognitive experiences are downstream of this metabolic priority — upends
    the standard model of mind and has real implications for stress, focus, and decision-making.

    '
  year_published: 2020
- _library_item: true
  accessibility: general
  author: Stephen Wolfram
  category: applied_science_tech
  cooldown_days: 180

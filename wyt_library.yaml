  url: https://www.eugenewei.com/blog/2020/9/18/seeing-like-an-algorithm
  why_worth_reading: 'Eugene Wei''s explanation of why TikTok''s algorithm succeeded
    where others failed — by building a "performance-friendly" interface that made
    it easy for the algorithm to accurately measure what users actually wanted — is
    the clearest account of how recommendation systems shape culture. Applies to any
    platform or data-driven product.

    '
  year_published: 2020

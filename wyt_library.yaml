  title: What Is ChatGPT Doing — And Why Does It Work?
  url: https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/
  why_worth_reading: 'Wolfram''s step-by-step explanation of how large language models
    actually work — from token prediction to why they produce coherent sentences despite
    no "understanding" — is the most accessible technically accurate account available.
    Anyone using AI tools professionally should understand this.

    '
  year_published: 2023

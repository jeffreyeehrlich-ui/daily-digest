  tier: 1
  times_featured: 0
  title: Meditations of Marcus Aurelius — Book II
  url: https://classics.mit.edu/Antoninus/meditations.2.two.html
  why_worth_reading: 'Marcus Aurelius writing privately to himself about impermanence,
    duty, and the discipline of perception — these are not platitudes but a general''s
    field notes on staying rational under pressure. Book II is the sharpest, most
    quotable entry point to the entire Meditations.

    '
  year_published: 180
- _library_item: true
  accessibility: general
  author: Seneca
  category: philosophy_stoicism
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 5
  source: Wikisource
  tier: 1
  times_featured: 0
  title: 'Letters from a Stoic — Letter I: On Saving Time'
  url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_1
  why_worth_reading: 'Seneca''s first letter opens with one of the most incisive observations
    ever written about how time is squandered through distraction and deferral. The
    argument that we are "robbed" of time only with our consent is still the clearest
    framework for protecting attention.

    '
  year_published: 65
- _library_item: true
  accessibility: general
  author: Epictetus
  category: philosophy_stoicism
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 9
  source: MIT Classics
  tier: 1
  times_featured: 0
  title: The Enchiridion — Epictetus
  url: https://classics.mit.edu/Epictetus/epicench.html
  why_worth_reading: 'The Enchiridion is the most direct distillation of Stoic practice
    ever written — the dichotomy of control, reframed as a daily discipline of discernment.
    It reads in under ten minutes and operates as a reset button for any day that
    feels out of control.

    '
  year_published: 135
- _library_item: true
  accessibility: general
  author: Ryan Holiday
  category: philosophy_stoicism
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 7
  source: Ryan Holiday
  tier: 2
  times_featured: 0
  title: The Obstacle Is the Way — Ryan Holiday
  url: https://ryanholiday.net/the-obstacle-is-the-way/
  why_worth_reading: 'Holiday''s essay-length distillation of the core Stoic insight
    — that resistance to difficulty is the problem, not the difficulty itself — applied
    to real business and leadership situations. It''s the most practically actionable
    entry point to applied Stoicism for working professionals.

    '
  year_published: 2014
- _library_item: true
  accessibility: general
  author: Ryan Holiday
  category: philosophy_stoicism
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 6
  source: Daily Stoic
  tier: 2
  times_featured: 0
  title: 'Amor Fati: The Formula for Human Greatness'
  url: https://dailystoic.com/amor-fati/
  why_worth_reading: 'The concept of amor fati — loving what happens, not merely tolerating
    it — is one of the most counterintuitive and useful mental postures for anyone
    navigating uncertainty. Holiday traces the idea from Nietzsche back to the Stoics
    clearly and compellingly.

    '
  year_published: 2018
- _library_item: true
  accessibility: general
  author: Ryan Holiday
  category: philosophy_stoicism
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 5
  source: Daily Stoic
  tier: 2
  times_featured: 0
  title: The View from Above — Daily Stoic
  url: https://dailystoic.com/view-from-above/
  why_worth_reading: 'The Stoic practice of zooming out — visualizing your problems
    from the perspective of centuries, continents, or the cosmos — is a surprisingly
    effective antidote to urgency bias. This essay explains the technique and its
    origins in Marcus Aurelius.

    '
  year_published: 2019
- _library_item: true
  accessibility: general
  author: Ryan Holiday
  category: philosophy_stoicism
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 7
  source: Daily Stoic
  tier: 2
  times_featured: 0
  title: 'Memento Mori: The Reminder You Need'
  url: https://dailystoic.com/memento-mori/
  why_worth_reading: 'The Stoic practice of death meditation sounds morbid but is
    actually liberating — it clarifies what matters, cuts through trivial anxieties,
    and forces honest prioritization. Holiday traces the historical practice from
    Roman generals to modern neuroscience.

    '
  year_published: 2017
- _library_item: true
  accessibility: general
  author: Ryan Holiday
  category: philosophy_stoicism
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 8
  source: Ryan Holiday
  tier: 2
  times_featured: 0
  title: Ego Is the Enemy — The Danger of Early Pride
  url: https://ryanholiday.net/ego-is-the-enemy/
  why_worth_reading: 'Holiday''s diagnosis of how ego manifests in talented people
    — not as arrogance but as narrative inflation, premature celebration, and resistance
    to feedback — is uncomfortably accurate. The case studies from Sherman, Eleanor
    Roosevelt, and others make it concrete and memorable.

    '
  year_published: 2016
- _library_item: true
  accessibility: general
  author: Tim Urban
  category: philosophy_other
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 10
  source: Wait But Why
  tier: 1
  times_featured: 0
  title: The Tail End
  url: https://waitbutwhy.com/2015/12/the-tail-end.html
  why_worth_reading: 'Tim Urban''s visual essay on the arithmetic of time remaining
    with the people you love is one of the most impactful pieces on prioritization
    ever written. The simple math — most of what you''ll ever do with your parents
    has already happened — lands with permanent force.

    '
  year_published: 2015
- _library_item: true
  accessibility: general
  author: Paul Graham
  category: philosophy_other
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 14
  source: Paul Graham
  tier: 1
  times_featured: 0
  title: How to Do Great Work
  url: https://paulgraham.com/greatwork.html
  why_worth_reading: 'Paul Graham''s comprehensive theory of creative excellence —
    how curiosity compounds, why working on what genuinely excites you is the prerequisite
    for originality, and how to distinguish ambitious failure from mediocre success.
    Dense but every paragraph earns its space.

    '
  year_published: 2023
- _library_item: true
  accessibility: general
  author: Paul Graham
  category: philosophy_other
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 12
  source: Paul Graham
  tier: 1
  times_featured: 0
  title: What You'll Wish You'd Known
  url: https://paulgraham.com/hs.html
  why_worth_reading: 'Ostensibly advice for high schoolers, this essay is actually
    a rigorous argument for intellectual curiosity as the only reliable compounding
    asset. The observation that most people never figure out what they find interesting
    — and why — is as sharp for forty-year-olds as for teenagers.

    '
  year_published: 2005
- _library_item: true
  accessibility: general
  author: Antonia Macaro
  category: philosophy_other
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 9
  source: Aeon
  tier: 2
  times_featured: 0
  title: The Courage to Be Disliked — Aeon Review
  url: https://aeon.co/essays/adlerian-psychology-and-the-freedom-of-individual-choice
  why_worth_reading: 'Alfred Adler''s psychology — that all problems are ultimately
    interpersonal problems, and that freedom comes from separating your tasks from
    others'' — is the most practically useful philosophical framework most people
    have never encountered. This Aeon essay is the clearest introduction to it.

    '
  year_published: 2022
- _library_item: true
  accessibility: general
  author: Howard Marks
  category: investing_finance
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 10
  source: Oaktree Capital
  tier: 1
  times_featured: 1
  title: The Most Important Thing — Howard Marks Memo
  url: https://www.oaktreecapital.com/docs/default-source/memos/2003-07-01-the-most-important-thing.pdf
  why_worth_reading: 'Marks argues that second-level thinking — asking not just what
    will happen but what the consensus thinks will happen and whether that''s priced
    in — is the only sustainable source of edge in investing. This foundational memo
    predates his book and is still the clearest statement of the idea.

    '
  year_published: 2003
- _library_item: true
  accessibility: general
  author: Warren Buffett
  category: investing_finance
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 12
  source: Berkshire Hathaway
  tier: 1
  times_featured: 0
  title: You and Your Company — Warren Buffett 1986 Berkshire Letter
  url: https://www.berkshirehathaway.com/letters/1986.html
  why_worth_reading: 'Buffett''s 1986 letter contains his sharpest long-form explanation
    of how Berkshire evaluates capital allocation — why earning power matters more
    than reported earnings, and why management incentives determine corporate culture
    more than stated mission. A masterclass in reading businesses.

    '
  year_published: 1987
- _library_item: true
  accessibility: general
  author: Morgan Housel
  category: investing_finance
  cooldown_days: 180
  cumulative_rating: 0
  estimated_read_minutes: 7
  source: Collaborative Fund
  tier: 2
  times_featured: 0
  title: Beating the Market Is Harder Than You Think — Morgan Housel
  url: https://www.collaborativefund.com/blog/beating-the-market-is-harder-than-you-think/
  why_worth_reading: 'Housel''s argument that active outperformance requires being
    not just right, but differently right than the vast majority of sophisticated
    capital — and that most edges are competed away within months — is the clearest
    honest account of why index funds win. Every capital allocator should read this.

    '
  year_published: 2021
- _library_item: true
  accessibility: general
  author: Morgan Housel
  category: investing_finance
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 15
  source: Collaborative Fund
  tier: 1
  times_featured: 0
  title: The Psychology of Money — Full Essay
  url: https://www.collaborativefund.com/blog/the-psychology-of-money/
  why_worth_reading: 'The essay that became Housel''s book: twenty observations about
    how humans actually behave with money versus how finance textbooks say they should.
    The observation that personal finance is more personal than finance — that behavior
    matters more than knowledge — is the central insight of behavioral finance made
    accessible.

    '
  year_published: 2018
- _library_item: true
  accessibility: general
  author: Howard Marks
  category: investing_finance
  cooldown_days: 365
  cumulative_rating: 0
  estimated_read_minutes: 12
  source: Oaktree Capital
  tier: 1
  times_featured: 1
  title: Risk Revisited — Howard Marks Memo
  url: https://www.oaktreecapital.com/docs/default-source/memos/2014-09-03-risk-revisited.pdf
  why_worth_reading: 'Marks dismantles the textbook definition of risk as volatility
    and replaces it with a far more useful framework: risk is the probability of a
    permanent, unrecoverable loss. For anyone allocating capital in illiquid markets
    — like real estate PE — this reframing has direct practical consequences.

    '
  year_published: 2014
- _library_item: true

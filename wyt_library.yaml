  url: https://www.technologyreview.com/2023/09/06/1079100/the-coming-wave-mustafa-suleyman-interview/
  why_worth_reading: 'Suleyman''s argument that the combination of AI and synthetic
    biology creates an unprecedented technology wave — one that compresses decades
    of change into years — is the most sober and well-reasoned case for why this moment
    is genuinely different. Not hype, not dismissal.

    '
  year_published: 2023

  tier: 2
  times_featured: 0
  title: The Equity Risk Premium — Aswath Damodaran
  url: https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/eqrisk.pdf
  why_worth_reading: 'Damodaran''s annual essay on the equity risk premium is the
    most rigorous free resource on how markets price uncertainty. Understanding the
    ERP is foundational for any cap rate or discount rate conversation. This one is
    dense — worth the effort for anyone doing valuation work.

    '
  year_published: 2022
- _library_item: true

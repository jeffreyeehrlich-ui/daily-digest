  # ── Research & Market Intelligence ────────────────────────────────────────
  # Scraped sources (type: scrape) pull the public insights/research listing
  # pages directly.  RSS sources aggregate institutional research from wire
  # services.  All scraped sources use a 7-day lookback (168 h).
  research_intel:

    # Investment-bank and asset-manager insights pages (scraped)
    - name: Goldman Sachs Insights
      url: https://www.goldmansachs.com/insights/
      type: scrape
      lookback_hours: 168

    - name: Morgan Stanley Ideas
      url: https://www.morganstanley.com/ideas
      type: scrape
      lookback_hours: 168

    - name: JPMorgan Insights
      url: https://www.jpmorgan.com/insights
      type: scrape
      lookback_hours: 168

    - name: BlackRock Investment Institute
      url: https://www.blackrock.com/us/individual/insights
      type: scrape
      lookback_hours: 168

    # CRE broker research pages (scraped)
    - name: CBRE Research
      url: https://www.cbre.com/insights/articles
      type: scrape
      lookback_hours: 168

    - name: JLL Research
      url: https://www.us.jll.com/en/trends-and-insights/research
      type: scrape
      lookback_hours: 168

    - name: Newmark Research
      url: https://www.nmrk.com/insights
      type: scrape
      lookback_hours: 168

    - name: Berkadia Research
      url: https://www.berkadia.com/insights/
      type: scrape
      lookback_hours: 168

    - name: Marcus & Millichap Research
      url: https://www.marcusmillichap.com/research
      type: scrape
      lookback_hours: 168

    # RSS aggregators for institutional research coverage
    - name: Bloomberg Economics
      url: https://feeds.bloomberg.com/economics/news.rss
      lookback_hours: 24

    - name: RealPage Analytics
      url: https://www.realpage.com/analytics/feed/
      lookback_hours: 24

    - name: GlobeSt
      url: https://www.globest.com/rss/
      lookback_hours: 24

  # ── The Economist (daily rotation via economist_history.json) ────────────
  # Note: full RSS requires an active Economist subscription. If this returns
  # 403/404, the section is skipped gracefully by digest.py.
  economist:
    - name: The Economist
      url: https://www.economist.com/rss/the_economist_full_rss.xml
